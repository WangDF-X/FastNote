<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- FastNote 应用图标 · 小尺寸版（16 / 20 / 24 / 32 px）

       与母版同结构、同配色，只做四处针对像素的调整：
       1. 纸块与母版一样放大 1.2561（边:块:边 = 1:3:1），两者必须同比例，否则 32→40 会跳变；
       2. 折角放大到 190，否则 16px 下蓝角只剩一个像素；
       3. 字母笔画加粗到 0.34，否则 F 会糊成一块；
       4. 去掉折痕柔性暗部，那几像素在这个尺寸只会变成脏点；纸色边加粗到 13。 -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#E9DFC9"/>

  <g transform="translate(512 512) scale(1.2561) translate(-526 -511)">
    <path d="M550 236 H382 A70 70 0 0 0 312 306 V716 A70 70 0 0 0 382 786 H670
             A70 70 0 0 0 740 716 V426 L586 426 A36 36 0 0 1 550 390 Z" fill="#2C2823"/>

    <path d="M550 236 L550 390 A36 36 0 0 0 586 426 L740 426 Z" fill="#2E6BE6"/>

    <path d="M550 236 L550 390 A36 36 0 0 0 586 426 L740 426" fill="none"
          stroke="#F7F0DE" stroke-width="13" stroke-linecap="round"/>

    <g transform="translate(512 512) skewX(-11) translate(-512 -512)" fill="#F7F0DE">
      <rect x="400" y="472" width="65" height="246" rx="5"/>
      <rect x="400" y="472" width="190" height="65" rx="5"/>
      <rect x="400" y="589" width="150" height="65" rx="5"/>
    </g>
  </g>
</svg>
