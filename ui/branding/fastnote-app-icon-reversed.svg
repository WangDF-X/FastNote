<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- FastNote 应用图标 · 反白版（深色界面、深色宣传图、深色托盘）

       结构与母版一致，只把明暗关系倒过来：
       底板变深（#17181B，暗色界面上相当于消失），纸块变米白；
       字母 F 真正镂空 —— 透过字母看到的就是底板，所以镂空色与底板同色；
       折角的“纸厚”边改成深色，因为浅色纸身上只能靠暗边读出厚度；
       折角蓝提亮到 #4A86FF，避免在深色底上发闷。
       纸块放大 1.2561（边:块:边 = 1:3:1），与母版构图一致。 -->
  <defs>
    <filter id="fold-shade-r" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="flap-clip-r">
      <path d="M580 236 L580 366 A30 30 0 0 0 610 396 L740 396 Z"/>
    </clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="#17181B"/>

  <g transform="translate(512 512) scale(1.2561) translate(-526 -511)">
    <path d="M580 236 H382 A70 70 0 0 0 312 306 V716 A70 70 0 0 0 382 786 H670
             A70 70 0 0 0 740 716 V396 L610 396 A30 30 0 0 1 580 366 Z" fill="#F7F0DE"/>

    <path d="M580 236 L580 366 A30 30 0 0 0 610 396 L740 396 Z" fill="#4A86FF"/>

    <g clip-path="url(#flap-clip-r)">
      <path d="M580 236 L740 396" stroke="#000000" stroke-opacity="0.30" stroke-width="26"
            fill="none" filter="url(#fold-shade-r)"/>
    </g>

    <path d="M580 236 L580 366 A30 30 0 0 0 610 396 L740 396" fill="none"
          stroke="#17181B" stroke-width="8" stroke-linecap="round"/>

    <g transform="translate(512 512) skewX(-11) translate(-512 -512)" fill="#17181B">
      <rect x="396" y="444" width="56" height="256" rx="5"/>
      <rect x="396" y="444" width="188" height="56" rx="5"/>
      <rect x="396" y="562" width="147" height="56" rx="5"/>
    </g>
  </g>
</svg>
