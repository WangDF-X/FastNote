[workspace]
resolver = "2"
members = [
    "crates/fastnote-core",
    "crates/fastnote-store",
    "crates/fastnote-platform",
    "crates/fastnote-ui",
    "crates/fastnote-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[workspace.dependencies]
fastnote-core = { path = "crates/fastnote-core" }
fastnote-store = { path = "crates/fastnote-store" }
fastnote-platform = { path = "crates/fastnote-platform" }
fastnote-ui = { path = "crates/fastnote-ui" }
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-18"] }
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
